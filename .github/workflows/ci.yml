name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Installs the Bun version pinned in mise.lock (mise.toml says "latest").
      - uses: jdx/mise-action@v3
        env:
          MISE_LOCKFILE: "true"

      - run: bun install --frozen-lockfile
      - run: bunx biome ci .
      - run: bun run check
      - run: bun run test
