name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Installs the Bun version pinned in mise.lock (mise.toml says "latest").
      - uses: jdx/mise-action@v3
        env:
          MISE_LOCKFILE: "true"

      - run: bun install --frozen-lockfile

      - name: Build binaries
        run: |
          mkdir -p dist
          build() {
            bun build --compile --target "$1" --outfile "dist/$2" src/cli.ts
          }
          # x64 targets use the baseline (no AVX2) builds so older CPUs still run.
          build bun-linux-x64-baseline   gh-trend-linux-amd64
          build bun-linux-arm64          gh-trend-linux-arm64
          build bun-darwin-x64-baseline  gh-trend-darwin-amd64
          build bun-darwin-arm64         gh-trend-darwin-arm64
          build bun-windows-x64-baseline gh-trend-windows-amd64.exe

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes
